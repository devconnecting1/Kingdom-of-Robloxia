# Every check runs here, never on a developer machine: Luau formatting, linting, type checking and tests, the Rojo
# place build, and the preview app (Prettier, ESLint, TypeScript) that renders the real UI into screenshots.
name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  luau:
    name: Luau (StyLua, Selene, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-luau
      - name: StyLua
        run: bash scripts/ci/run.sh "StyLua" stylua --check src tests tools
      # Every check runs even when an earlier one failed, so one push shows every problem.
      - name: Selene
        if: success() || failure()
        run: bash scripts/ci/run.sh "Selene" selene src
      - name: Type check (luau-lsp, strict)
        if: success() || failure()
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          curl -fsSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau \
            || curl -fsSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.None.d.luau
          bash scripts/ci/run.sh "luau-lsp" luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json src
      - name: Tests (Lune) — rules, protocol, locale and a 50-kingdom simulation
        if: success() || failure()
        run: lune run tests/run.luau

  place:
    name: Rojo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-luau
      - run: mkdir -p build && rojo build default.project.json --output build/KingdomOfRobloxia.rbxl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: place
          path: build/KingdomOfRobloxia.rbxl
          retention-days: 14

  preview:
    name: UI preview (Prettier, ESLint, TypeScript, screenshots)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-luau
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install (lockfile when present)
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Prettier
        run: bash ../scripts/ci/run.sh "Prettier" npx prettier --check .
      - name: ESLint
        if: success() || failure()
        run: bash ../scripts/ci/run.sh "ESLint" npx eslint .
      - name: Render the Luau UI to scenes (Lune)
        if: success() || failure()
        working-directory: .
        run: lune run tools/render.luau
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Screenshots
        run: node scripts/screenshot.mjs ../out/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: out/screenshots
          retention-days: 30
